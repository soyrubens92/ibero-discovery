<title>IBERO Discovery</title>

<style>
:root{
  --bg:#F7F7F9; --surface:#FFFFFF; --fg:#18181B; --fg2:#3F3F46; --muted:#71717A; --faint:#A1A1AA;
  --line:#E7E7EB; --line2:#D9D9DF; --accent:#5B3DF5; --accent-ink:#4A2FE0; --accent-soft:#F2EFFE; --ok:#10A36E; --ok-soft:#E9F7F1; --warn:#B45309; --warn-soft:#FEF3E2;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:22px;width:auto;display:block}
.brand .tag{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line2);padding-left:12px;white-space:nowrap}
.save{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.save i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.save[data-s="saved"] i{background:var(--ok)}
.save[data-s="saving"] i{background:#E0A100}
.segs-w{max-width:1040px;margin:0 auto}
.segs{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;padding-bottom:12px}
.segs[hidden]{display:none!important}
.seg{all:unset;cursor:pointer;height:16px;display:flex;align-items:center}
.seg span{display:block;width:100%;height:3px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.seg span i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;transition:width .35s ease}
.seg.cur span{background:var(--line2)}
.seg:focus-visible span{outline:2px solid var(--accent);outline-offset:3px}

main{max-width:1040px;margin:0 auto;padding-block:48px 96px}
.screen{display:grid;gap:28px}
.kicker{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font-size:clamp(30px,4.6vw,40px);line-height:1.12;letter-spacing:-.025em;font-weight:700;margin:0;text-wrap:balance;max-width:22ch}
h2{font-size:clamp(24px,3.4vw,30px);line-height:1.15;letter-spacing:-.02em;font-weight:700;margin:0;text-wrap:balance}
p{margin:0}
.lead{font-size:16.5px;color:var(--fg2);max-width:60ch;line-height:1.6}
.sub{color:var(--muted);max-width:58ch}

/* Welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
.letter{display:grid;gap:18px}
.sign{display:flex;align-items:center;gap:12px;padding-top:6px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.sign b{display:block;font-weight:600;font-size:14px}
.sign small{color:var(--muted);font-size:12.5px}
.facts{display:flex;gap:28px;flex-wrap:wrap;padding-top:6px}
.facts div{display:grid;gap:2px}
.facts b{font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.facts small{color:var(--muted);font-size:12.5px}
.index{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.index-h{padding:14px 18px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.index button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;box-sizing:border-box;padding:11px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.index button:last-child{border-bottom:0}
.index button:hover{background:#FAFAFB}
.index button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.index .num{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.index .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.index .st.ok{color:var(--ok)}

/* Section */
.section{display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px;align-items:start}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);display:grid;gap:14px}
.qs{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.q{padding:22px 24px;border-bottom:1px solid var(--line);display:grid;gap:12px;min-width:0}
.q:last-child{border-bottom:0}
.ql{font-weight:600;font-size:15px;line-height:1.45;color:var(--fg);display:flex;gap:10px}
.ql .n{color:var(--faint);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;min-width:22px;padding-top:1px}
.qb{display:grid;gap:10px;padding-left:32px;min-width:0}
.hint{color:var(--muted);font-size:13.5px;margin-top:-6px}
.opt-tag{color:var(--faint);font-weight:500;font-size:13px}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:0 12px;width:100%;max-width:300px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .u{font-size:13.5px;color:var(--muted);white-space:nowrap}
.field input{all:unset;flex:1;min-width:0;padding:10px 0;font-variant-numeric:tabular-nums;color:var(--fg);font-size:15px}
.field input::placeholder{color:var(--faint)}
.field.off{background:#FAFAFB}
.txt,textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:88px;resize:vertical;line-height:1.5}
.txt::placeholder,textarea::placeholder{color:var(--faint)}
.txt:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unk{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);justify-self:start;border-bottom:1px dashed var(--line2);line-height:1.3}
.unk:hover{color:var(--fg2)}
.unk[aria-pressed="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.unk:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line2);border-radius:8px;font-size:14px;color:var(--fg2);background:var(--surface);transition:border-color .15s,background .15s,color .15s}
.opt:hover span{border-color:#BDBDC7}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.btn{all:unset;text-decoration:none;cursor:pointer;font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);text-align:center}
.btn:hover{border-color:#BDBDC7}
.btn.pri{background:var(--fg);border-color:var(--fg);color:#fff}
.btn.pri:hover{background:#000}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.acc:hover{background:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.35;cursor:default}
.ghost{all:unset;cursor:pointer;font-size:14px;color:var(--muted)}
.ghost:hover{color:var(--fg)}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

/* Review */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.stat .k{font-size:13px;color:var(--muted)}
.stat b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b.na{color:var(--faint);font-weight:500;font-size:18px}
.stat b.warn{color:var(--warn)}
.stat small{color:var(--faint);font-size:12px;line-height:1.35}
.read{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:8px;max-width:72ch}
.read b{font-weight:600}
.read.flag{background:var(--warn-soft);border-color:#F5D9B0}
.missing{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:5px 10px;border-radius:6px;background:#F1F1F4;color:var(--fg2)}
.chip:hover{background:#E8E8EC}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre.out{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:260px;overflow:auto;margin:0}

/* Done */
.done{max-width:560px;display:grid;gap:18px}
.check{width:44px;height:44px;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center}
.next{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.next div{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14.5px}
.next div:last-child{border-bottom:0}
.next .n{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

@media screen and (max-width:860px){
  .welcome,.section{grid-template-columns:1fr;gap:28px}
  .aside{position:static}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding-block:28px 72px}
}
@media screen and (max-width:520px){
  .brand .tag{display:none}
  .q{padding:18px 16px}
  .qb{padding-left:0}
  .ql .n{display:none}
  .field{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  {id:"s_canales",l:"¿Por dónde dan seguimiento?",type:"multi",o:["Llamada","WhatsApp","Correo","Bot","Visitas y open house"]},
  {id:"s_asesores",l:"¿Cuántos asesores de admisiones hay?",type:"num",suf:"asesores",ph:"8"},
  {id:"s_queja",l:"¿De qué se queja admisiones sobre los leads actuales?",type:"area"},
  {id:"cal_primavera",l:"Primavera 2027: ¿fechas de examen y cierre de inscripciones?",type:"text"},
  {id:"cal_otono",l:"Otoño 2027: ¿cuándo abre la convocatoria y cuándo son los exámenes?",type:"text"},
  {id:"cal_eventos",l:"¿Qué eventos clave vienen?",hint:"Open house, ferias, becas, vacaciones.",type:"area"}
 ]},
 {id:"contexto",t:"Contexto y criterio de éxito",why:"Lo que no viene en ningún reporte y define cómo ganamos con ustedes.",q:[
  {id:"c_porque",l:"¿Por qué deciden cambiar de agencia?",type:"area"},
  {id:"c_nofunciono",l:"¿Qué han probado que no funcionó?",type:"area"},
  {id:"c_aspirante",l:"¿Cómo es el aspirante ideal y quién decide: el alumno o sus papás?",type:"area"},
  {id:"c_competidores",l:"¿Con quién compiten más por cada alumno?",type:"multi",o:["Anáhuac","Tec de Monterrey","ITAM","Panamericana","La Salle","UNAM y públicas","Estudiar fuera","Otra"]},
  {id:"c_diferencial",l:"¿Por qué un aspirante elige la IBERO y por qué la descarta?",type:"area"},
  {id:"c_marca",l:"¿Qué restricciones de marca hay y cuánto tarda una aprobación?",type:"area"},
  {id:"c_material",l:"¿Qué material tienen disponible?",type:"multi",o:["Video de campus","Testimonios","Alumnos embajadores","Fotografía","Rankings y acreditaciones","Nada reciente"]},
  {id:"c_exito",l:"Al día 90, ¿qué tendría que pasar para que digan que valió la pena?",type:"area"},
  {id:"c_miedo",l:"¿Qué es lo que más les preocupa de este cambio?",type:"area"}
 ]},
 {id:"cierre",t:"Contratación y próximos pasos",why:"Salir con firmante identificado, proceso de compras claro y fecha para la estrategia personalizada.",q:[
  {id:"fee_estado",l:"¿Cómo está la propuesta económica?",type:"choice",o:["Aprobada","Aprobada con ajustes","En revisión","Con objeciones"]},
  {id:"fee_comentarios",l:"¿Qué comentarios tienen sobre la propuesta?",type:"area",opt:true},
  {id:"compras_pasos",l:"¿Qué pasos y tiempos tiene compras para darnos de alta?",type:"area"},
  {id:"facturacion",l:"¿Razón social y condiciones de pago?",type:"text",ph:"Ej. 30 días"},
  {id:"arranque",l:"¿Es viable arrancar el 19 de octubre?",type:"choice",o:["Sí","Con accesos parciales","Se mueve"]},
  {id:"fecha_estrategia",l:"¿Para cuándo entregamos la estrategia personalizada?",type:"text",ph:"Fecha"},
  {id:"proximos",l:"Próximos pasos: quién, qué y cuándo",type:"area"}
 ]}
];
const UNK="No lo sé";
const ENDPOINT="https://script.google.com/macros/s/AKfycbyp4kuJ4-ybPWbCSHNQAFU0Hgggq5ajtPit_xoD8iYYIl2dAwbgGthUCZ__l52bvb0bsw/exec";
const PLAN={li:0.039,cpi:8929,pauta90:3000000};
const QS=S.flatMap(s=>s.q);
const REQ=QS.filter(q=>!q.opt);
let A={}, view="welcome", cur=0, submitted=false;
const KEY="ibero-discovery-v1";
try{const p=JSON.parse(localStorage.getItem(KEY)||"null");if(p){A=p.answers||{};submitted=!!p.submitted}}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has=v=>Array.isArray(v)?v.length>0:(v!=null&&String(v).trim()!=="");
const num=id=>{const v=parseFloat(String(A[id]??"").replace(/[,$\s]/g,""));return isFinite(v)?v:null};
const money=v=>"$"+Math.round(v).toLocaleString("es-MX");
const int=v=>Math.round(v).toLocaleString("es-MX");
const pct=v=>(v*100).toFixed(1)+"%";
const secDone=s=>s.q.filter(q=>!q.opt&&has(A[q.id])).length;
const secReq=s=>s.q.filter(q=>!q.opt).length;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function setSave(s,t){$("#save").dataset.s=s;$("#saveTxt").textContent=t}

function renderSegs(){
  const n=$("#segs"); n.hidden=(view==="welcome"||view==="done");
  n.innerHTML=S.map((s,i)=>{const p=Math.round(secDone(s)/secReq(s)*100);return `<button class="seg ${view==="sec"&&i===cur?"cur":""}" type="button" data-i="${i}" aria-label="${esc(s.t)}, ${p}% contestado"><span><i style="width:${p}%"></i></span></button>`}).join("");
  n.querySelectorAll(".seg").forEach(b=>b.onclick=()=>openSec(+b.dataset.i));
}
function show(html){const v=$("#view");v.innerHTML=`<div class="screen fade">${html}</div>`;renderSegs()}
function scrollTop(){try{scrollTo({top:0,behavior:"smooth"})}catch(e){scrollTo(0,0)}}

/* Welcome */
function renderWelcome(){
  view="welcome";
  const total=REQ.length, done=REQ.filter(q=>has(A[q.id])).length, started=done>0;
  show(`<div class="welcome">
    <div class="letter">
      <p class="kicker">Discovery · 16 de octubre de 2026</p>
      <h1>Antes de arrancar el 19 de octubre, queremos entender la operación de admisiones con números.</h1>
      <p class="lead">Estas preguntas nos dicen qué parte de la meta depende de la pauta, cuánto cuesta hoy cada inscrito, qué activos hay que asegurar y cómo vamos a medir contra matrícula real.</p>
      <p class="sub">Contestamos lo que sepamos hoy. Lo que no esté medido se marca y lo resolvemos en los primeros 14 días.</p>
      <div class="facts"><div><b>${S.length}</b><small>secciones</small></div><div><b>325</b><small>inscritos por sumar</small></div><div><b>${done}/${total}</b><small>contestadas</small></div></div>
      <div class="nav" style="justify-content:flex-start"><button class="btn acc" id="start" type="button">${started?"Continuar":"Empezar"}</button></div>
      <div class="sign"><span class="avatar">RR</span><span><b>Rubén Ruiz</b><small>Caperifai</small></span></div>
    </div>
    <div class="index"><div class="index-h">Lo que vamos a cubrir</div>
      ${S.map((s,i)=>{const d=secDone(s),r=secReq(s);return `<button type="button" data-i="${i}"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${esc(s.t)}</span><span class="st ${d===r?"ok":""}">${d===r?"Listo":d?d+" de "+r:""}</span></button>`}).join("")}
    </div>
  </div>`);
  $("#start").onclick=()=>{const i=S.findIndex(s=>secDone(s)<secReq(s));openSec(i<0?0:i)};
  document.querySelectorAll(".index button").forEach(b=>b.onclick=()=>openSec(+b.dataset.i));
}

/* Section */
function field(q){
  const v=A[q.id], unk=v===UNK;
  if(q.type==="num") return `<div class="field ${unk?"off":""}">${q.pre?`<span class="u">${esc(q.pre)}</span>`:""}<input id="q-${q.id}" type="text" inputmode="decimal" autocomplete="off" value="${unk?"":esc(v)}" placeholder="${unk?"Sin dato":esc(q.ph||"")}" ${unk?"disabled":""} aria-label="${esc(q.l)}">${q.suf?`<span class="u">${esc(q.suf)}</span>`:""}</div>
    <button type="button" class="unk" id="u-${q.id}" aria-pressed="${unk}">${unk?"Marcado como no lo sé":"No lo tienen medido"}</button>`;
  if(q.type==="text") return `<input class="txt" id="q-${q.id}" type="text" value="${esc(v)}" placeholder="${esc(q.ph||"")}" aria-label="${esc(q.l)}">`;
  if(q.type==="area") return `<textarea id="q-${q.id}" placeholder="${esc(q.ph||"")}" aria-label="${esc(q.l)}">${esc(v)}</textarea>`;
  const m=q.type==="multi", sel=m?(v||[]):[v];
  return `<div class="opts" role="${m?"group":"radiogroup"}" aria-label="${esc(q.l)}">${q.o.map((o,i)=>`<label class="opt"><input id="q-${q.id}-${i}" type="${m?"checkbox":"radio"}" name="q-${q.id}" value="${esc(o)}" ${sel.includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`;
}
function openSec(i){
  view="sec"; cur=i; const s=S[i];
  show(`<div class="section">
    <div class="aside">
      <p class="kicker">${i+1} de ${S.length}</p>
      <h2>${esc(s.t)}</h2>
      <p class="sub">${esc(s.why)}</p>
    </div>
    <div style="display:grid;gap:20px;min-width:0">
      <div class="qs">${s.q.map((q,k)=>`<div class="q" data-q="${q.id}">
        <div class="ql"><span class="n">${i+1}.${k+1}</span><span>${esc(q.l)}${q.opt?' <span class="opt-tag">Opcional</span>':""}</span></div>
        <div class="qb">${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}${field(q)}</div>
      </div>`).join("")}</div>
      <div class="nav">
        <button class="ghost" id="back" type="button">${i===0?"Volver al inicio":"Anterior"}</button>
        <button class="btn pri" id="fwd" type="button">${i===S.length-1?"Revisar y enviar":"Siguiente"}</button>
      </div>
    </div>
  </div>`);
  s.q.forEach(wire);
  $("#back").onclick=()=>{i===0?renderWelcome():openSec(i-1);scrollTop()};
  $("#fwd").onclick=()=>{i===S.length-1?renderReview():openSec(i+1);scrollTop()};
}
function wire(q){
  const card=document.querySelector(`[data-q="${q.id}"]`);
  if(q.type==="choice"||q.type==="multi"){
    card.querySelectorAll("input").forEach(inp=>inp.addEventListener("change",()=>{
      A[q.id]=q.type==="multi"?[...card.querySelectorAll("input:checked")].map(x=>x.value):inp.value;changed()}));
    return;
  }
  const inp=document.getElementById("q-"+q.id);
  inp.addEventListener("input",()=>{if(q.type==="num"){const c=inp.value.replace(/[^0-9.,]/g,"");if(c!==inp.value)inp.value=c}A[q.id]=inp.value;changed()});
  const u=document.getElementById("u-"+q.id);
  if(u) u.onclick=()=>{const on=A[q.id]!==UNK;A[q.id]=on?UNK:"";const f=card.querySelector(".field");
    f.classList.toggle("off",on);inp.disabled=on;inp.value="";inp.placeholder=on?"Sin dato":(q.ph||"");
    u.setAttribute("aria-pressed",on);u.textContent=on?"Marcado como no lo sé":"No lo tienen medido";if(!on)inp.focus();changed()};
}
function changed(){renderSegs();save()}

/* Review */
function calc(){
  const meta=num("meta_inscritos")??500, hoy=num("inscritos_hoy")??175, gap=Math.max(meta-hoy,0);
  const pp=num("pct_pauta"), gapP=pp!=null?gap*pp/100:null;
  const hi=num("h_inversion"), hl=num("h_leads"), hs=num("h_solicitudes"), hn=num("h_inscritos");
  const li=(hl&&hn)?hn/hl:null, cpi=(hi&&hn)?hi/hn:null, cpl=(hi&&hl)?hi/hl:null, ls=(hl&&hs)?hs/hl:null;
  const useCpi=cpi??PLAN.cpi, useLi=li??PLAN.li, base=gapP??gap;
  const invNeed=base*useCpi, leadsNeed=base/useLi;
  const c=num("colegiatura"), sm=num("semestres");
  const ltv=(c&&sm)?c*sm*(1-(num("beca")??0)/100)*((num("retencion")??100)/100):null;
  const tot=num("pauta_mes"), g=num("inv_google"), m=num("inv_meta"), t=num("inv_tiktok");
  const sumCh=[g,m,t,num("inv_otros")].reduce((a,b)=>a+(b||0),0), den=tot||sumCh||null;
  const mix=den&&(g||m||t)?`${Math.round((g||0)/den*100)} / ${Math.round((m||0)/den*100)} / ${Math.round((t||0)/den*100)}`:null;
  return {meta,hoy,gap,pp,gapP,li,cpi,cpl,ls,useCpi,useLi,invNeed,leadsNeed,ltv,mix,hist:cpi!=null};
}
function stat(k,v,fmt,note,cls){return `<div class="stat"><span class="k">${k}</span>${v==null?'<b class="na">Sin dato</b>':`<b class="${cls||""}">${fmt(v)}</b>`}<small>${note}</small></div>`}
function owners(){const ids=["own_bm","own_google","own_tiktok","own_ga"];const r=ids.filter(i=>A[i]&&A[i]!=="IBERO").length;return r}
function renderReview(){
  view="review"; const c=calc();
  const done=REQ.filter(q=>has(A[q.id])).length;
  const miss=S.map((s,i)=>({s,i,n:secReq(s)-secDone(s)})).filter(x=>x.n>0);
  const over=c.invNeed>PLAN.pauta90;
  let read=`<p><b>Sumar ${int(c.gapP??c.gap)} inscritos${c.gapP!=null?" atribuibles a pauta":""} pide cerca de ${money(c.invNeed)} de inversión</b> a ${money(c.useCpi)} por inscrito (${c.hist?"su histórico":"ruta del plan"}). La pauta de los 90 días es de ${money(PLAN.pauta90)}.</p>`;
  read+= over?`<p>La diferencia es de ${money(c.invNeed-PLAN.pauta90)}. Se cierra con más inversión, con mejor conversión del embudo o ajustando qué parte de la meta depende de medios.</p>`:`<p>Con esa pauta la meta es alcanzable si el costo por inscrito se sostiene. Lo validamos con datos propios al día 30.</p>`;
  if(c.pp==null) read+=`<p>Falta saber qué porcentaje de los inscritos llega por pauta. Mientras tanto, el cálculo supone que el 100% depende de medios.</p>`;
  if(c.ltv) read+=`<p>Cada inscrito representa cerca de ${money(c.ltv)} en colegiaturas netas: ${int(c.ltv/c.useCpi)} veces lo que cuesta conseguirlo.</p>`;
  const risk=owners(), payRisk=A.pago==="Digimedia paga y refactura"||A.pago==="Mixto", shared=A.accesos==="Contraseñas compartidas"||A.accesos==="Mixto";
  const flags=[risk?`${risk} de 4 plataformas sin titularidad confirmada de la IBERO.`:"",payRisk?"La pauta no se paga 100% desde la IBERO: riesgo de campañas detenidas al salir Digimedia.":"",shared?"Accesos con contraseñas compartidas: cambiar credenciales solo después de asegurar titularidad y pagos.":""].filter(Boolean);
  show(`<div style="display:grid;gap:12px"><p class="kicker">Revisión</p><h2>Primera lectura de los números</h2><p class="sub">Son estimados para la conversación, no un compromiso. Se recalibran con datos propios al día 30.</p></div>
    <div class="stats">
      ${stat("Por sumar a la meta",c.gap,int,`${int(c.hoy)} de ${int(c.meta)} inscritos`)}
      ${stat("Atribuibles a pauta",c.gapP,int,c.pp!=null?`${c.pp}% de los inscritos llega por pauta`:"Falta el % que llega por pauta")}
      ${stat("Inversión implícita",c.invNeed,money,`vs ${money(PLAN.pauta90)} de pauta en 90 días`,over?"warn":"")}
      ${stat("Leads necesarios",c.leadsNeed,int,`Con lead a inscrito de ${pct(c.useLi)}`)}
      ${stat("Costo por inscrito",c.cpi,money,"Histórico · ruta del plan $8,929")}
      ${stat("Costo por lead",c.cpl,money,"Histórico · ruta del plan $351")}
      ${stat("Lead a solicitud",c.ls,pct,"Histórico · compromiso ≥10%")}
      ${stat("Mix Google / Meta / TikTok",c.mix,v=>v,"Plan inicial 45 / 40 / 12")}
    </div>
    <div class="read">${read}</div>
    ${flags.length?`<div class="read flag">${flags.map(f=>`<p>${f}</p>`).join("")}</div>`:""}
    ${miss.length?`<div style="display:grid;gap:10px"><p class="sub">Llevamos ${done} de ${REQ.length} respuestas. Se puede enviar así y completar después.</p><div class="missing">${miss.map(x=>`<button class="chip" type="button" data-i="${x.i}">${esc(x.s.t)} · faltan ${x.n}</button>`).join("")}</div></div>`:`<p class="sub">Está todo contestado.</p>`}
    <div id="send"></div>
    <div class="nav" style="justify-content:flex-start"><button class="ghost" id="back" type="button">Volver a la última sección</button></div>`);
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{openSec(+b.dataset.i);scrollTop()});
  $("#back").onclick=()=>{openSec(S.length-1);scrollTop()};
  const box=$("#send");
  box.innerHTML=`<div class="nav" style="justify-content:flex-start"><button class="btn acc" id="go" type="button">${submitted?"Actualizar respuestas":"Enviar a Caperifai"}</button><button class="btn" id="copy" type="button">Copiar respuestas</button></div><p class="sub" id="err" hidden>No se pudo enviar. Revisa la conexión e inténtalo de nuevo, o copia las respuestas.</p>`;
  $("#go").onclick=async()=>{const g=$("#go");g.disabled=true;g.textContent="Enviando";
    try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({cliente:"IBERO",submitted:true,answers:A,texto:asText()})});
      submitted=true;saveLocal();renderDone();scrollTop()}
    catch(e){g.disabled=false;g.textContent="Enviar a Caperifai";$("#err").hidden=false}};
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(asText());toast("Respuestas copiadas")}catch(e){toast("No se pudo copiar")}};
}
function renderDone(){
  view="done";
  show(`<div class="done">
    <div class="check"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 10.5l3.2 3.2L15 7" stroke="#10A36E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Gracias. Ya tenemos el discovery de la IBERO.</h2>
    <p class="lead">Con esto ajustamos el plan de 90 días a sus números reales y aseguramos la transición sin detener campañas.</p>
    <div class="next">
      <div><span class="n">1</span><span>Validamos titularidad, pagos y accesos de cada plataforma antes de tocar cualquier cuenta.</span></div>
      <div><span class="n">2</span><span>Entregamos la estrategia personalizada con metas por canal y costo por inscrito objetivo.</span></div>
      <div><span class="n">3</span><span>Firmamos la definición de embudo al día 14 y recalibramos la ruta al día 30.</span></div>
    </div>
    <div class="nav" style="justify-content:flex-start"><button class="ghost" id="edit" type="button">Editar respuestas</button></div>
  </div>`);
  $("#edit").onclick=()=>{renderWelcome();scrollTop()};
}
function asText(){
  let o="IBERO CDMX · Discovery\n";
  S.forEach(s=>{o+=`\n${s.t.toUpperCase()}\n`;s.q.forEach(q=>{const v=A[q.id];o+=`${q.l}\n→ ${has(v)?(Array.isArray(v)?v.join(", "):(v===UNK?v:(q.pre||"")+String(v).replace(/\s*\n+\s*/g," · ")+(q.suf?" "+q.suf:""))):"Sin respuesta"}\n`})});
  return o;
}

/* Save */
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({answers:A,submitted}))}catch(e){}}
function save(){saveLocal();setSave("saved","Guardado en este dispositivo");return Promise.resolve()}

renderWelcome();
</script>

</html>
